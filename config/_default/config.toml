baseURL = "https://officeconnectpro.com/"
title = "OfficeConnect Pro"
enableRobotsTXT = true
enableGitInfo = true
defaultContentLanguage = "en"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  proxy = "direct"
  [[module.imports]]
    path = "github.com/google/docsy"
    disable = false
