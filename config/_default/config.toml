baseURL = "https://officeconnectpro.com/"
title = "OfficeConnectPro"
enableRobotsTXT = true
enableGitInfo = true
defaultContentLanguage = "en"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Taxonomies that drive audience filtering, content-type pages, and the version-compatibility matrix.
[taxonomies]
  tag = "tags"
  audience = "audiences"
  content_type = "content-types"
  release = "releases"

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.MarkdownSource]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    notAlternative = false
  [outputFormats.LLMsTxt]
    mediaType = "text/plain"
    isPlainText = true
    isHTML = false
    notAlternative = true
    baseName = "llms"

[outputs]
  home = ["HTML", "RSS", "LLMsTxt"]
  page = ["HTML", "MarkdownSource"]
  section = ["HTML", "RSS"]

[module]
  proxy = "direct"
  [[module.imports]]
    path = "github.com/google/docsy"
    disable = false
